name: Static site quality checks

on:
  push:
    branches:
      - maintenance/site-quality-gates
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-static-site:
    name: Validate pages and launch safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check static site
        run: python3 .github/maintenance/check_site.py
